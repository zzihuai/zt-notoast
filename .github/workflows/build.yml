name: Build ZT NoToast

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK="$ANDROID_HOME"; [ -z "$SDK" ] && SDK="$ANDROID_SDK_ROOT"; [ -z "$SDK" ] && SDK=/usr/local/lib/android/sdk
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$SDK"/platforms/* | sort -V | tail -1)
          echo "SDK=$SDK"; echo "BT=$BT"; echo "PLAT=$PLAT"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "PLAT=$PLAT" >> "$GITHUB_ENV"

      - name: Compile
        run: |
          set -eux
          AJAR="$PLAT/android.jar"
          mkdir -p out/stubs out/classes out/dex
          find stubs -name '*.java' > out/stubs.txt
          javac -nowarn -d out/stubs @out/stubs.txt
          jar cf out/stubs.jar -C out/stubs .
          find src -name '*.java' > out/main.txt
          javac -source 8 -target 8 -nowarn -Xlint:-options \
                -cp "out/stubs.jar:$AJAR" -d out/classes @out/main.txt
          find out/classes -name '*.class' > out/classes.txt
          "$BT/d8" --lib "$AJAR" --lib out/stubs.jar --min-api 21 \
                --output out/dex @out/classes.txt
          ls -l out/dex

      - name: Package
        run: |
          set -eux
          AJAR="$PLAT/android.jar"
          "$BT/aapt2" compile --dir res -o out/res.zip
          "$BT/aapt2" link -o out/unsigned.apk -I "$AJAR" \
                --manifest AndroidManifest.xml -A assets out/res.zip \
                --min-sdk-version 21 --target-sdk-version 34 \
                --version-code 1 --version-name 1.0
          ( cd out/dex && zip -j ../unsigned.apk classes.dex )
          unzip -l out/unsigned.apk

      - name: Sign
        run: |
          set -eux
          keytool -genkeypair -keystore out/ks.jks -storetype pkcs12 \
                -storepass android -keypass android -alias zt \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=ZT NoToast, O=local, C=CN"
          "$BT/zipalign" -f -p 4 out/unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks out/ks.jks --ks-pass pass:android \
                --key-pass pass:android --out out/zt-notoast.apk out/aligned.apk
          "$BT/apksigner" verify --print-certs out/zt-notoast.apk | head -8
          ls -l out/zt-notoast.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zt-notoast-apk
          path: out/zt-notoast.apk
